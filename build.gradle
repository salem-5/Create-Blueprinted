plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
    id 'me.modmuss50.mod-publish-plugin' version '2.0.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.tterrag.com/" }        // Registrate
    maven { url = "https://mvn.devos.one/snapshots" }   // Registrate (snapshots)
    maven { url = "https://maven.createmod.net" }       // Create, Ponder, Flywheel, Catnip
    maven { url = "https://maven.minecraftforge.net/" } // Forge
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.forge_version

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Create's Forge artifacts are published in SRG (production) mappings, so they must go through
    // ModDevGradle's remapping configurations (mod*) to be usable against the official-named dev MC.
    // These configurations are NOT transitive — catnip is bundled inside the Ponder jar.
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modCompileOnly   ("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly   ("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

    // Create's mixins use MixinExtras (@WrapOperation). NeoForge bundles it; Forge does not, and the
    // :slim Create jar strips it, so we supply it ourselves. Pure bytecode lib (no MC refs) — it
    // self-bootstraps via its MixinConnector, so a plain runtime dependency is enough.
    runtimeOnly("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def properties = new Properties()
    def file = file("gradle.properties")
    if (file.exists()) {
        file.withInputStream { properties.load(it) }
    }
    def replaceProperties = properties.collectEntries { key, value ->
        [(key): value]
    }

    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

apply from: rootProject.file('publish.gradle')
