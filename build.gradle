plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.0.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel, C2ME
    maven { url = "https://api.modrinth.com/maven" } // Create Schematic Preview
    maven { url = "https://maven.terraformersmc.com/releases" } // EMI
    maven { url = "https://maven.blamejared.com" } // JEI
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {

    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    jarJar(implementation("maven.modrinth:create-schematic-preview:${schematic_preview_version}"));

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    compileOnlyApi("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def properties = new Properties()
    def file = file("gradle.properties")
    if(file.exists()) {
        file.withInputStream { properties.load(it)}
    }
    def replaceProperties = properties.collectEntries { key, value ->
        [(key): value]
    }

    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
publishing {
    publications {register('mavenJava', MavenPublication) {from components.java}}
    repositories {maven {url "file://${project.projectDir}/repo"}}
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

ext.brassworksMaven = [
    artifactId: 'create-blueprinted',
    pom: [
        name: mod_name,
        description: mod_description,
        url: 'https://github.com/salem-5/Create-Blueprinted',
        license: mod_license,
        developerId: mod_authors,
        scmUrl: 'https://github.com/salem-5/Create-Blueprinted',
        scmConnection: 'scm:git:https://github.com/salem-5/Create-Blueprinted.git',
    ],
    pruneGroups: ['maven.modrinth', 'mezz.jei'],
]
apply from: rootProject.file('gradle/brassworks-maven.gradle')
publishing.publications.maven {
    version = "${mod_version}+mc${minecraft_version}-${mod_loader}"
}

apply from: rootProject.file('publish.gradle')
